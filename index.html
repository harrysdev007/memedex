<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memexiom</title>
  <meta name="description" content="Memexiom. Your terminal for meme discovery. Search across the internet, explore templates and build your collection.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#08090b">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=17">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/memexiom-favicon-32.png?v=17">
  <link rel="icon" type="image/png" sizes="64x64" href="icons/memexiom-favicon-64.png?v=17">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/memexiom-apple-touch.png?v=17">
  <link rel="preload" href="assets/fonts/xn7_YHE41ni1AdIRqAuZuw1Bx9mbZk79FO_F.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fonts/V8mQoQDjQSkFtoMM3T6r8E7mF71Q-gOoraIAEj42Vksj.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="assets/fonts/fonts.css?v=14">
  <link rel="stylesheet" href="css/memegle.css?v=17">
  <script>
    // Apply saved theme before first paint to avoid a flash.
    try {
      var s = JSON.parse(localStorage.getItem('memegle.settings') || '{}');
      if (s.theme === 'light' || s.theme === 'dark') document.documentElement.setAttribute('data-theme', s.theme);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="terminal-chrome"></div>
  <div id="app" aria-live="polite"></div>
  <footer id="terminal-footer"></footer>
  <div id="toast" class="toast" role="status"></div>
  <input id="file-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple class="hidden">
  <input id="lens-input" type="file" accept="image/*" class="hidden">
  <input id="import-input" type="file" accept="application/json" class="hidden">
  <noscript><p style="padding:40px;text-align:center;font-family:var(--font)">Memexiom needs JavaScript.</p></noscript>
  <script type="module" src="js/app.js?v=17"></script>
</body>
</html>
